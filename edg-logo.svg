<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E10600"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
  </defs>

  <!-- Shield shape -->
  <path d="M250 60 L400 110 L400 260 C400 350 320 420 250 450 C180 420 100 350 100 260 L100 110 Z"
        fill="url(#shieldGrad)" stroke="#E10600" stroke-width="3"/>

  <!-- Inner subtle border -->
  <path d="M250 82 L378 125 L378 258 C378 336 312 400 250 425 C188 400 122 336 122 258 L122 125 Z"
        fill="none" stroke="#E10600" stroke-width="0.8" opacity="0.25"/>

  <!-- Eagle wings stylized -->
  <path d="M170 200 L205 165 L225 185 L250 145 L275 185 L295 165 L330 200 L295 235 L275 218 L255 248 L250 265 L245 248 L225 218 L205 235 Z"
        fill="#E10600" opacity="0.85"/>

  <!-- EDG Text -->
  <text x="250" y="342" text-anchor="middle" fill="white" font-size="62" font-family="Arial Black, Impact, sans-serif" font-weight="900" letter-spacing="5">EDG</text>

  <!-- Red accent bar -->
  <rect x="185" y="362" width="130" height="4" rx="2" fill="url(#redAccent)"/>

  <!-- VCT London subtitle -->
  <text x="250" y="398" text-anchor="middle" fill="#888" font-size="20" font-family="Arial, sans-serif" font-weight="600" letter-spacing="8">VCT LONDON</text>

  <!-- Small red dot accent at top -->
  <circle cx="250" cy="60" r="4" fill="#E10600" opacity="0.5"/>
</svg>
